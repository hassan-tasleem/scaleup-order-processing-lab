spring.application.name=scaleup-normal
server.port=8080

# Loads application-local.properties (database user and password, not committed)
spring.profiles.active=local

# Lab-only admin endpoints (reset, verify, simulation). Set to false outside the lab.
scaleup.admin.enabled=true

# Database connection
spring.datasource.url=jdbc:postgresql://localhost:5432/scaleup_db

# Connection pool: fixed and visible so it cannot silently differ between projects
spring.datasource.hikari.pool-name=scaleup-pool
spring.datasource.hikari.maximum-pool-size=10

# JPA / Hibernate: the schema comes from Flyway; Hibernate only checks it matches the entities
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.generate_statistics=false

# Actuator and Micrometer
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles.http.server.requests=0.5,0.95,0.99
server.tomcat.mbeanregistry.enabled=true